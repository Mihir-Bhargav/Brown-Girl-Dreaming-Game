<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- pixel-art open book, in the game's colours -->
  <rect width="16" height="16" rx="3" fill="#2a1a10"/>
  <!-- pages -->
  <rect x="2" y="4" width="5" height="8" fill="#fbf7ec"/>
  <rect x="9" y="4" width="5" height="8" fill="#fbf7ec"/>
  <rect x="3" y="3" width="4" height="1" fill="#fbf7ec"/>
  <rect x="9" y="3" width="4" height="1" fill="#fbf7ec"/>
  <!-- spine and cover edge -->
  <rect x="7" y="4" width="2" height="9" fill="#a5703c"/>
  <rect x="1" y="12" width="14" height="1" fill="#a5703c"/>
  <!-- lines of verse -->
  <rect x="3" y="5" width="3" height="1" fill="#8c5c30"/>
  <rect x="3" y="7" width="2" height="1" fill="#8c5c30"/>
  <rect x="3" y="9" width="3" height="1" fill="#8c5c30"/>
  <rect x="10" y="5" width="3" height="1" fill="#8c5c30"/>
  <rect x="10" y="7" width="3" height="1" fill="#8c5c30"/>
  <rect x="10" y="9" width="2" height="1" fill="#8c5c30"/>
  <!-- yellow bookmark -->
  <rect x="11" y="2" width="2" height="3" fill="#ffd43b"/>
</svg>
