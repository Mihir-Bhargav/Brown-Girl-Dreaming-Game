<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brown Girl Dreaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b1d14; --paper:#f6ecd4; --paper2:#e9d9b4; --accent:#b4502f; --gold:#ffd43b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#101810; overflow:hidden; }
  #game { position:fixed; inset:0; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .px { font-family:'Press Start 2P', monospace; }
  body { font-family:'VT323', monospace; }

  #hud { position:fixed; top:12px; left:14px; right:14px; display:flex; justify-content:space-between; pointer-events:none; z-index:5; }
  #hud div { font-family:'Press Start 2P', monospace; font-size:11px; color:#fff; background:rgba(20,14,10,.72); border:3px solid #000; padding:8px 10px; text-shadow:1px 1px #000; }
  #hint { position:fixed; bottom:10px; left:14px; z-index:5; color:#f6ecd4; background:rgba(20,14,10,.6); padding:4px 10px; font-size:20px; pointer-events:none; }

  #prompt { position:fixed; bottom:48px; left:50%; transform:translateX(-50%) translateY(8px); opacity:0; transition:.12s; z-index:6;
    font-family:'Press Start 2P', monospace; font-size:12px; color:var(--ink); background:var(--gold); border:3px solid #000; box-shadow:4px 4px 0 #000; padding:10px 14px; pointer-events:none; }
  #prompt.on { opacity:1; transform:translateX(-50%); }
  #prompt.locked { background:#cfc6b2; color:#3a2f26; }
  #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:7; opacity:0; transition:.15s; pointer-events:none;
    font-family:'Press Start 2P', monospace; font-size:12px; color:var(--ink); background:#cfc6b2; border:3px solid #000; box-shadow:4px 4px 0 #000; padding:10px 14px; }
  #toast.on { opacity:1; }

  #panel { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,8,5,.55); z-index:20; padding:16px; }
  #panel.on { display:flex; }
  .card { width:min(860px,100%); max-height:92vh; overflow:auto; background:var(--paper); color:var(--ink); border:5px solid #000; box-shadow:8px 8px 0 #000; padding:22px 26px; }
  .card h2 { font-family:'Press Start 2P', monospace; font-size:clamp(14px,2.2vw,20px); line-height:1.4; margin:0 0 14px; color:var(--accent); }
  blockquote { margin:0 0 4px; padding:10px 16px; border-left:6px solid var(--accent); background:var(--paper2); font-size:clamp(24px,3.2vw,34px); line-height:1.15; white-space:pre-wrap; }
  .cite { font-size:20px; opacity:.7; margin:0 0 14px 22px; }
  #p-analysis h4 { font-family:'Press Start 2P', monospace; font-size:11px; margin:14px 0 6px; color:#5a3a22; }
  #p-analysis ul { margin:0; padding-left:22px; font-size:clamp(20px,2.4vw,26px); line-height:1.15; }
  .foot { margin-top:16px; font-size:20px; opacity:.65; display:flex; gap:18px; }

  #title { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 40%, #3a2316 0%, #130c07 75%); color:var(--paper); transition:opacity .5s; padding:20px; }
  #title.off { opacity:0; pointer-events:none; }
  #title h1 { font-family:'Press Start 2P', monospace; font-size:clamp(20px,4.6vw,46px); line-height:1.35; color:var(--gold); text-shadow:4px 4px 0 #6b2a14; margin:0 0 18px; }
  #title-sub { font-size:clamp(24px,3vw,34px); margin:0 0 6px; }
  #title-by { font-size:22px; opacity:.7; margin:0 0 40px; }
  #title .go { font-family:'Press Start 2P', monospace; font-size:12px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #ride { position:fixed; left:0; right:0; top:8%; z-index:10; display:none; flex-direction:column; align-items:center; text-align:center; pointer-events:none; padding:0 16px; }
  #ride.on { display:flex; }
  #ride-title { font-family:'Press Start 2P', monospace; font-size:clamp(12px,2.4vw,22px); color:var(--gold); text-shadow:3px 3px 0 #000; margin-bottom:14px; }
  #ride-line { font-size:clamp(22px,2.8vw,32px); color:var(--paper); text-shadow:2px 2px 0 #000; max-width:760px; }
  #ride-skip { position:fixed; bottom:10px; right:14px; font-size:20px; color:var(--paper); opacity:.6; }
  #ride.dream #ride-title { color:#2b3a55; text-shadow:none; }
  #ride.dream #ride-line, #ride.dream #ride-skip { color:#2b3a55; text-shadow:none; }

  #slide { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(10,8,5,.62); z-index:25; padding:16px; }
  #slide.on { display:flex; }
  #slide .card { border-color:#000; background:#1f1610; color:var(--paper); width:min(900px,100%); }
  #c-kicker { font-family:'Press Start 2P', monospace; font-size:11px; color:var(--gold); letter-spacing:1px; margin-bottom:12px; }
  #c-head { font-family:'Press Start 2P', monospace; font-size:clamp(16px,2.6vw,26px); line-height:1.4; margin:0 0 16px; color:#fff; }
  #slide blockquote { background:#2e2118; color:var(--paper); border-left-color:var(--gold); font-size:clamp(22px,2.9vw,32px); }
  #slide .cite { color:var(--paper); }
  #c-points { margin:6px 0 0; padding-left:24px; font-size:clamp(21px,2.5vw,28px); line-height:1.18; }
  #c-points li { margin-bottom:8px; }
  #slide .foot { color:var(--paper); }

  #outro { position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:radial-gradient(circle at 50% 40%, #3a2316 0%, #130c07 75%); color:var(--paper); padding:20px; animation:fadein .8s; }
  #outro.on { display:flex; }
  #outro h1 { font-family:'Press Start 2P', monospace; font-size:clamp(22px,5vw,52px); line-height:1.35; color:var(--gold); text-shadow:4px 4px 0 #6b2a14; margin:0 0 22px; }
  #outro-quote { font-size:clamp(24px,3vw,34px); margin:0 0 10px; max-width:820px; white-space:pre-line; }
  #outro-by { font-size:22px; opacity:.7; margin:0 0 40px; }
  #outro .go { font-family:'Press Start 2P', monospace; font-size:12px; animation:blink 1s steps(2) infinite; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }

  #runhud { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:6; display:none; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  #runhud.on { display:flex; }
  #run-word { display:flex; gap:4px; }
  #run-word span { font-family:'Press Start 2P', monospace; font-size:clamp(11px,1.6vw,16px); color:#8a7f70; background:rgba(20,14,10,.75); border:3px solid #000; padding:6px 7px; }
  #run-word span.got { color:var(--ink); background:var(--gold); }
  #run-lives { font-size:30px; color:#ff6b6b; text-shadow:2px 2px 0 #000; }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud"><div id="hud-zone"></div><div id="hud-found"></div></div>
  <div id="ride"><div id="ride-title"></div><div id="ride-line"></div><div id="ride-skip">E / Enter: skip</div></div>
  <div id="hint">Move: arrows / WASD &nbsp;·&nbsp; Examine: E &nbsp;·&nbsp; Next / previous zone: N / B &nbsp;·&nbsp; Slides: C</div>
  <div id="prompt"></div>
  <div id="toast"></div>

  <div id="panel">
    <div class="card">
      <h2 id="p-title"></h2>
      <blockquote id="p-quote"></blockquote>
      <p class="cite" id="p-cite"></p>
      <div id="p-analysis"></div>
      <div class="foot"><span>E / Esc: close</span><span id="p-audio">R: replay audio</span></div>
    </div>
  </div>

  <div id="slide">
    <div class="card">
      <div id="c-kicker"></div>
      <h2 id="c-head"></h2>
      <blockquote id="c-quote"></blockquote>
      <p class="cite" id="c-cite"></p>
      <ul id="c-points"></ul>
      <div class="foot"><span id="c-step"></span><span>E: continue · Esc: skip</span><span id="c-audio">R: replay audio</span></div>
    </div>
  </div>

  <div id="runhud"><div id="run-word"></div><div id="run-lives"></div></div>

  <div id="outro">
    <h1 id="outro-h"></h1>
    <p id="outro-quote"></p>
    <p id="outro-by"></p>
    <div class="go" id="outro-go"></div>
  </div>

  <div id="title">
    <h1 id="title-h"></h1>
    <p id="title-sub"></p>
    <p id="title-by"></p>
    <div class="go">PRESS ENTER</div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script src="src/content.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/maps.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
